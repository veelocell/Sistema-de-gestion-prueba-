<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VELOCELL REPARACIONES - Sistema Local</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap');
        body { font-family: 'Inter', sans-serif; }
        .fade-in { animation: fadeIn 0.3s ease; }
        @keyframes fadeIn { from { opacity:0; transform:translateY(10px); } to { opacity:1; transform:translateY(0); } }
        
        @media print {
            body * { visibility: hidden !important; }
            #printArea, #printArea * { visibility: visible !important; }
            #printArea { 
                position: absolute; 
                left: 0; 
                top: 0; 
                width: 100%;
                background: white;
            }
            .no-print { display: none !important; }
        }
        
        .ticket-thermal { 
            width: 80mm; 
            margin: 0 auto; 
            padding: 10px; 
            font-family: 'Courier New', monospace; 
            font-size: 11px; 
            color: #000; 
        }
        .ticket-header { text-align:center; border-bottom: 1px dashed #000; padding-bottom: 10px; margin-bottom: 10px; }
        .ticket-row { display:flex; justify-content:space-between; margin: 5px 0; }
        .ticket-divider { border-top: 1px dashed #000; margin: 10px 0; }
    </style>
</head>
<body class="bg-gray-50">
    <!-- LOGIN -->
    <div id="loginScreen" class="min-h-screen flex items-center justify-center p-4 bg-gradient-to-br from-indigo-600 to-purple-700">
        <div class="w-full max-w-md bg-white rounded-2xl shadow-2xl p-8 fade-in">
            <div class="text-center mb-6">
                <h1 class="text-3xl font-bold text-gray-800 mb-2">VELOCELL</h1>
                <p class="text-gray-500">Sistema de Reparaciones</p>
            </div>
            <form id="loginForm" class="space-y-4">
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">Usuario</label>
                    <input type="text" id="username" required class="w-full px-4 py-3 border border-gray-200 rounded-lg focus:ring-2 focus:ring-indigo-500 outline-none" placeholder="admin">
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">Contraseña</label>
                    <input type="password" id="password" required class="w-full px-4 py-3 border border-gray-200 rounded-lg focus:ring-2 focus:ring-indigo-500 outline-none" placeholder="••••••••">
                </div>
                <button type="submit" class="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-semibold py-3 rounded-lg transition">Iniciar Sesión</button>
            </form>
            <p class="text-center text-xs text-gray-400 mt-6">Usuario: admin | Contraseña: 1234</p>
        </div>
    </div>

    <!-- MAIN APP -->
    <div id="mainApp" class="hidden">
        <header class="bg-white border-b border-gray-200 px-6 py-4">
            <div class="flex items-center justify-between">
                <div>
                    <h1 class="text-xl font-bold text-gray-800">🔧 VELOCELL REPARACIONES</h1>
                    <p class="text-sm text-gray-500" id="currentDate"></p>
                </div>
                <button onclick="logout()" class="bg-red-500 hover:bg-red-600 text-white px-4 py-2 rounded-lg text-sm">Cerrar Sesión</button>
            </div>
        </header>

        <main class="p-6">
            <div class="grid grid-cols-2 md:grid-cols-4 gap-4 mb-6">
                <div class="bg-white rounded-xl p-5 shadow-sm border border-gray-100">
                    <p class="text-sm text-gray-500">Órdenes Activas</p>
                    <p class="text-2xl font-bold text-gray-800" id="statActivas">0</p>
                </div>
                <div class="bg-white rounded-xl p-5 shadow-sm border border-gray-100">
                    <p class="text-sm text-gray-500">Ingresos Hoy</p>
                    <p class="text-2xl font-bold text-emerald-600" id="statIngresos">$0</p>
                </div>
                <div class="bg-white rounded-xl p-5 shadow-sm border border-gray-100">
                    <p class="text-sm text-gray-500">En Espera</p>
                    <p class="text-2xl font-bold text-amber-600" id="statEspera">0</p>
                </div>
                <div class="bg-white rounded-xl p-5 shadow-sm border border-gray-100">
                    <p class="text-sm text-gray-500">Entregados</p>
                    <p class="text-2xl font-bold text-purple-600" id="statEntregados">0</p>
                </div>
            </div>

            <div class="flex gap-3 mb-6 flex-wrap">
                <button onclick="showNewOrderModal()" class="bg-indigo-600 hover:bg-indigo-700 text-white px-6 py-3 rounded-xl font-medium transition">
                    + Nueva Orden
                </button>
                <button onclick="exportData()" class="bg-green-600 hover:bg-green-700 text-white px-6 py-3 rounded-xl font-medium transition">
                    💾 Exportar Datos
                </button>
                <label class="bg-blue-600 hover:bg-blue-700 text-white px-6 py-3 rounded-xl font-medium transition cursor-pointer">
                    📁 Importar Datos
                    <input type="file" id="importFile" class="hidden" accept=".json" onchange="importData(event)">
                </label>
            </div>

            <div class="bg-white rounded-xl shadow-sm border border-gray-100 overflow-hidden">
                <div class="p-4 border-b border-gray-100">
                    <input type="text" id="searchInput" placeholder="Buscar por cliente, teléfono o folio..." 
                           oninput="renderOrders()" 
                           class="w-full px-4 py-2 border border-gray-200 rounded-lg focus:ring-2 focus:ring-indigo-500 outline-none">
                </div>
                <div class="overflow-x-auto">
                    <table class="w-full">
                        <thead class="bg-gray-50">
                            <tr>
                                <th class="text-left p-4 text-sm font-semibold text-gray-600">Folio</th>
                                <th class="text-left p-4 text-sm font-semibold text-gray-600">Cliente</th>
                                <th class="text-left p-4 text-sm font-semibold text-gray-600">Equipo</th>
                                <th class="text-left p-4 text-sm font-semibold text-gray-600">Estado</th>
                                <th class="text-right p-4 text-sm font-semibold text-gray-600">Precio</th>
                                <th class="text-right p-4 text-sm font-semibold text-gray-600">Acciones</th>
                            </tr>
                        </thead>
                        <tbody id="ordersTable" class="divide-y divide-gray-100"></tbody>
                    </table>
                </div>
            </div>
        </main>
    </div>

    <!-- Modal Nueva Orden -->
    <div id="newOrderModal" class="hidden fixed inset-0 bg-black/50 z-50 flex items-center justify-center p-4">
        <div class="bg-white rounded-2xl w-full max-w-2xl max-h-[90vh] overflow-y-auto">
            <div class="sticky top-0 bg-white border-b border-gray-100 p-6 flex items-center justify-between">
                <h2 class="text-xl font-bold text-gray-800">📝 Nueva Orden de Servicio</h2>
                <button onclick="closeModal('newOrderModal')" class="w-8 h-8 rounded-lg hover:bg-gray-100 flex items-center justify-center">✕</button>
            </div>
            <form id="orderForm" class="p-6 space-y-4">
                <div class="grid md:grid-cols-2 gap-4">
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-1">Nombre del Cliente *</label>
                        <input type="text" id="clientName" required class="w-full px-4 py-2.5 border border-gray-200 rounded-lg focus:ring-2 focus:ring-indigo-500 outline-none">
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-1">Teléfono *</label>
                        <input type="tel" id="clientPhone" required class="w-full px-4 py-2.5 border border-gray-200 rounded-lg focus:ring-2 focus:ring-indigo-500 outline-none">
                    </div>
                </div>
                <div class="grid md:grid-cols-2 gap-4">
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-1">Marca *</label>
                        <select id="deviceBrand" required class="w-full px-4 py-2.5 border border-gray-200 rounded-lg focus:ring-2 focus:ring-indigo-500 outline-none">
                            <option value="">Seleccionar...</option>
                            <option>Samsung</option>
                            <option>iPhone</option>
                            <option>Xiaomi</option>
                            <option>Huawei</option>
                            <option>Motorola</option>
                            <option>Otro</option>
                        </select>
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-1">Modelo *</label>
                        <input type="text" id="deviceModel" required class="w-full px-4 py-2.5 border border-gray-200 rounded-lg focus:ring-2 focus:ring-indigo-500 outline-none">
                    </div>
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">Problema Reportado *</label>
                    <textarea id="problemDesc" required rows="2" class="w-full px-4 py-2.5 border border-gray-200 rounded-lg focus:ring-2 focus:ring-indigo-500 outline-none"></textarea>
                </div>
                <div class="grid md:grid-cols-2 gap-4">
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-1">Precio Total *</label>
                        <input type="number" id="repairCost" step="0.01" required class="w-full px-4 py-2.5 border border-gray-200 rounded-lg focus:ring-2 focus:ring-indigo-500 outline-none">
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-1">Anticipo (opcional)</label>
                        <input type="number" id="advancePayment" step="0.01" value="0" class="w-full px-4 py-2.5 border border-gray-200 rounded-lg focus:ring-2 focus:ring-indigo-500 outline-none">
                    </div>
                </div>
                <div class="flex gap-3 pt-4 border-t border-gray-100">
                    <button type="submit" class="flex-1 bg-indigo-600 hover:bg-indigo-700 text-white font-semibold py-3 rounded-xl transition">
                        💾 Guardar e Imprimir
                    </button>
                    <button type="button" onclick="closeModal('newOrderModal')" class="px-6 py-3 border border-gray-200 rounded-xl font-medium hover:bg-gray-50 transition">
                        Cancelar
                    </button>
                </div>
            </form>
        </div>
    </div>

    <div id="printArea" class="hidden"></div>

    <script>
        let orders = JSON.parse(localStorage.getItem('velocell_orders') || '[]');

        document.addEventListener('DOMContentLoaded', function() {
            updateDate();
            checkSession();
        });

        function updateDate() {
            const now = new Date();
            document.getElementById('currentDate').textContent = now.toLocaleDateString('es-MX', { 
                weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' 
            });
        }

        function checkSession() {
            const session = localStorage.getItem('velocell_session');
            if (session) showMainApp();
        }

        document.getElementById('loginForm').addEventListener('submit', function(e) {
            e.preventDefault();
            const username = document.getElementById('username').value;
            const password = document.getElementById('password').value;
            
            if (username === 'admin' && password === '1234') {
                localStorage.setItem('velocell_session', 'active');
                showMainApp();
            } else {
                alert('Usuario o contraseña incorrectos');
            }
        });

        function showMainApp() {
            document.getElementById('loginScreen').classList.add('hidden');
            document.getElementById('mainApp').classList.remove('hidden');
            renderOrders();
            updateStats();
        }

        function logout() {
            localStorage.removeItem('velocell_session');
            location.reload();
        }

        function showNewOrderModal() {
            document.getElementById('newOrderModal').classList.remove('hidden');
        }

        function closeModal(modalId) {
            document.getElementById(modalId).classList.add('hidden');
        }

        document.getElementById('orderForm').addEventListener('submit', function(e) {
            e.preventDefault();
            
            const order = {
                id: 'SRV-' + Date.now().toString().slice(-6),
                client: {
                    name: document.getElementById('clientName').value,
                    phone: document.getElementById('clientPhone').value
                },
                device: {
                    brand: document.getElementById('deviceBrand').value,
                    model: document.getElementById('deviceModel').value
                },
                problem: document.getElementById('problemDesc').value,
                repairCost: parseFloat(document.getElementById('repairCost').value),
                advancePayment: parseFloat(document.getElementById('advancePayment').value) || 0,
                status: 'En diagnóstico',
                date: new Date().toISOString(),
                paid: false
            };
            
            orders.unshift(order);
            saveOrders();
            closeModal('newOrderModal');
            this.reset();
            renderOrders();
            updateStats();
            printReceptionTicket(order);
            alert('✅ Orden creada exitosamente');
        });

        function saveOrders() {
            localStorage.setItem('velocell_orders', JSON.stringify(orders));
        }

        function renderOrders() {
            const search = document.getElementById('searchInput').value.toLowerCase();
            const tbody = document.getElementById('ordersTable');
            
            const filtered = orders.filter(o => 
                o.client.name.toLowerCase().includes(search) ||
                o.client.phone.includes(search) ||
                o.id.toLowerCase().includes(search)
            );
            
            if (filtered.length === 0) {
                tbody.innerHTML = '<tr><td colspan="6" class="p-8 text-center text-gray-400">No hay órdenes</td></tr>';
                return;
            }
            
            tbody.innerHTML = filtered.map(order => {
                const statusColors = {
                    'En diagnóstico': 'bg-blue-100 text-blue-700',
                    'Por revisar': 'bg-amber-100 text-amber-700',
                    'Reparado': 'bg-emerald-100 text-emerald-700',
                    'Entregado': 'bg-gray-100 text-gray-700'
                };
                
                return `
                    <tr class="hover:bg-gray-50">
                        <td class="p-4 font-semibold text-indigo-600">${order.id}</td>
                        <td class="p-4">
                            <p class="font-medium">${order.client.name}</p>
                            <p class="text-sm text-gray-500">${order.client.phone}</p>
                        </td>
                        <td class="p-4">${order.device.brand} ${order.device.model}</td>
                        <td class="p-4">
                            <span class="text-xs px-2 py-1 rounded-full ${statusColors[order.status] || 'bg-gray-100'}">
                                ${order.status}
                            </span>
                        </td>
                        <td class="p-4 text-right font-semibold">$${order.repairCost.toFixed(2)}</td>
                        <td class="p-4 text-right">
                            <button onclick="viewOrder('${order.id}')" class="text-indigo-600 hover:text-indigo-700 mr-2">Ver</button>
                            <button onclick="printTicket('${order.id}')" class="text-blue-600 hover:text-blue-700 mr-2">Imprimir</button>
                            <button onclick="deleteOrder('${order.id}')" class="text-red-600 hover:text-red-700">Eliminar</button>
                        </td>
                    </tr>
                `;
            }).join('');
        }

        function updateStats() {
            const today = new Date().toDateString();
            const activas = orders.filter(o => o.status !== 'Entregado').length;
            const entregados = orders.filter(o => o.status === 'Entregado').length;
            const espera = orders.filter(o => o.status === 'Reparado').length;
            const ingresosHoy = orders
                .filter(o => o.paid && new Date(o.date).toDateString() === today)
                .reduce((sum, o) => sum + o.repairCost, 0);
            
            document.getElementById('statActivas').textContent = activas;
            document.getElementById('statEntregados').textContent = entregados;
            document.getElementById('statEspera').textContent = espera;
            document.getElementById('statIngresos').textContent = '$' + ingresosHoy.toFixed(2);
        }

        function viewOrder(id) {
            const order = orders.find(o => o.id === id);
            if (!order) return;
            alert(`Folio: ${order.id}\nCliente: ${order.client.name}\nTeléfono: ${order.client.phone}\nEquipo: ${order.device.brand} ${order.device.model}\nProblema: ${order.problem}\nPrecio: $${order.repairCost.toFixed(2)}\nEstado: ${order.status}`);
        }

        function deleteOrder(id) {
            if (!confirm('¿Eliminar esta orden?')) return;
            orders = orders.filter(o => o.id !== id);
            saveOrders();
            renderOrders();
            updateStats();
        }

        function printReceptionTicket(order) {
            const printArea = document.getElementById('printArea');
            const fecha = new Date(order.date).toLocaleString('es-MX');
            
            printArea.innerHTML = `
                <div class="ticket-thermal">
                    <div class="ticket-header">
                        <h2 style="font-size: 16px; margin: 0;">VELOCELL REPARACIONES</h2>
                        <p style="margin: 5px 0;">NOTA DE RECEPCIÓN</p>
                        <p style="font-size: 10px;">${order.id}</p>
                    </div>
                    <div class="ticket-divider"></div>
                    <p style="font-weight: bold; margin: 10px 0 5px;">CLIENTE</p>
                    <div class="ticket-row"><span>Nombre:</span><span>${order.client.name}</span></div>
                    <div class="ticket-row"><span>Teléfono:</span><span>${order.client.phone}</span></div>
                    <div class="ticket-row"><span>Fecha:</span><span>${fecha}</span></div>
                    <div class="ticket-divider"></div>
                    <p style="font-weight: bold; margin: 10px 0 5px;">EQUIPO</p>
                    <div class="ticket-row"><span>Equipo:</span><span>${order.device.brand} ${order.device.model}</span></div>
                    <div style="margin: 5px 0;"><strong>Problema:</strong><br>${order.problem}</div>
                    <div class="ticket-divider"></div>
                    <p style="font-size: 10px; line-height: 1.5;">
                        • La garantía aplica únicamente con este ticket<br>
                        • Equipos no retirados en 90 días se consideran abandonados<br>
                        • No nos hacemos responsables por datos
                    </p>
                    <div class="ticket-divider"></div>
                    <div style="display: flex; justify-content: space-between; margin-top: 15px; font-size: 9px;">
                        <div style="width: 45%; border-top: 1px solid #000; padding-top: 3px; text-align: center;">Firma Cliente</div>
                        <div style="width: 45%; border-top: 1px solid #000; padding-top: 3px; text-align: center;">Recibido por</div>
                    </div>
                </div>
            `;
            
            printArea.classList.remove('hidden');
            setTimeout(() => {
                window.print();
                printArea.classList.add('hidden');
            }, 100);
        }

        function printTicket(id) {
            const order = orders.find(o => o.id === id);
            if (order) printReceptionTicket(order);
        }

        function exportData() {
            const dataStr = JSON.stringify(orders, null, 2);
            const dataBlob = new Blob([dataStr], {type: 'application/json'});
            const url = URL.createObjectURL(dataBlob);
            const link = document.createElement('a');
            link.href = url;
            link.download = 'velocell_backup_' + new Date().toISOString().split('T')[0] + '.json';
            link.click();
            URL.revokeObjectURL(url);
        }

        function importData(event) {
            const file = event.target.files[0];
            if (!file) return;
            
            const reader = new FileReader();
            reader.onload = function(e) {
                try {
                    const imported = JSON.parse(e.target.result);
                    if (Array.isArray(imported)) {
                        if (confirm(`¿Importar ${imported.length} órdenes? Esto reemplazará los datos actuales.`)) {
                            orders = imported;
                            saveOrders();
                            renderOrders();
                            updateStats();
                            alert('✅ Datos importados correctamente');
                        }
                    } else {
                        alert('❌ Archivo inválido');
                    }
                } catch (error) {
                    alert('❌ Error al leer el archivo: ' + error.message);
                }
            };
            reader.readAsText(file);
            event.target.value = '';
        }
    </script>
</body>
</html>
